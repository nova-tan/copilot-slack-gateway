[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-slack-gateway"
version = "0.1.0"
description = "Slack Socket Mode gateway driving persistent GitHub Copilot CLI (ACP) sessions"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.20",
    "aiohttp>=3.9",
]

[project.scripts]
copilot-slack-gateway = "copilot_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
