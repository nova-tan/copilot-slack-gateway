# Generic public example. Copy to slack-app-manifest.yaml before configuring
# a Slack app. Edit the ignored local file for workspace-specific commands.
# Apply changes in your Slack app under Settings -> App Manifest.
_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: copilot-gateway
  description: Talk to your local GitHub Copilot CLI from Slack
  background_color: "#1a1a2e"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: copilot-gateway
    always_online: true
  slash_commands:
      - command: /new
        description: "Start a fresh Copilot session"
        should_escape: false
        usage_hint: "[args]"
      - command: /stop
        description: "Cancel the active Copilot prompt"
        should_escape: false
        usage_hint: "[args]"
      - command: /steer
        description: "Interrupt the running prompt and fold new information into the task"
        should_escape: false
        usage_hint: "<new information>"
      - command: /tasks
        description: "Show active subagents and shell commands in this Copilot session"
        should_escape: false
        usage_hint: "[args]"
      - command: /stream-channel
        description: "Create or reuse a dedicated Slack channel for a Copilot stream"
        should_escape: false
        usage_hint: "[optional description or GitHub issue URL]"
      - command: /help
        description: "Show gateway usage help"
        should_escape: false
        usage_hint: "[args]"
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - channels:manage
      - channels:read
      - channels:write.invites
      - commands
      - im:history
      - im:read
      - im:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
